[package]
name = "ccstatus"
version = "0.1.0"
edition = "2024"
description = "Fast Claude Code status line: reads the statusLine JSON from stdin, renders powerline segments"
license = "MIT"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
toml = "1.1.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
